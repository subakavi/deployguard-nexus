name: DeployGuard Nexus CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install bandit

      # 4. Run tests and generate coverage
      - name: Run Tests and Generate Reports
        run: |
          python -m pytest \
            -v \
            --cov=app \
            --cov-report=json:coverage.json \
            --junitxml=test-results.xml

      # 5. Security scan
      - name: Run Security Scan
        run: |
          python -m bandit \
            -r app \
            -f json \
            -o bandit-report.json \
            --exit-zero

      # 6. Calculate deployment risk
      - name: Run Deployment Risk Analysis
        run: |
          python risk-engine/ci_metrics.py

      # 7. Deployment gate
      - name: Run Deployment Gate
        run: |
          python risk-engine/deployment_gate.py

      # 8. Generate dashboard data
      - name: Generate Dashboard Data
        env:
          DEPLOYMENT_ID: "${{ github.run_id }}"
          GITHUB_SHA: "${{ github.sha }}"
        run: |
          python risk-engine/generate_dashboard_data.py

      # 9. Display risk result
      - name: Display Risk Result
        run: |
          cat risk-result.json

      # 10. Create stable deployment history
      - name: Create Stable Deployment History
        run: |
          python -c "from backend.deployment_store import save_deployment; save_deployment({'id':'STABLE-001','commitId':'stable-001','riskScore':10,'riskLevel':'SAFE','decision':'APPROVED','status':'SUCCESS','rollback':False})"

          python -c "from backend.deployment_store import save_deployment; save_deployment({'id':'STABLE-002','commitId':'stable-002','riskScore':15,'riskLevel':'SAFE','decision':'APPROVED','status':'SUCCESS','rollback':False})"

          echo "Stable deployment history created."

      # 11. Create failed deployment
      - name: Create Failed Deployment
        run: |
          python -c "from backend.deployment_store import save_deployment; save_deployment({'id':'TEST-FAILED-001','commitId':'failed-001','riskScore':80,'riskLevel':'HIGH','decision':'BLOCKED','status':'FAILED','rollback':False})"

          echo "Failed deployment created."

      # 12. Simulate application failure
      - name: Simulate Application Failure
        run: |
          echo "========================================"
          echo "SIMULATING APPLICATION FAILURE"
          echo "========================================"
          echo "Application health check failed."
          echo "Recovery process will begin."

      # 13. Run self-healing rollback
      - name: Run Self-Healing Rollback
        env:
          CURRENT_DEPLOYMENT_ID: "TEST-FAILED-001"
        run: |
          python backend/recovery_manager.py

      # 14. Display recovery result
      - name: Display Recovery Result
        run: |
          echo "========================================"
          echo "SELF-HEALING RECOVERY RESULT"
          echo "========================================"
          cat dashboard/deployments.json

      # 15. Create AWS CodeDeploy package
      - name: Create Deployment Package
        run: |
          # Make shell scripts Linux-safe (LF line endings, executable)
          sed -i 's/\r$//' scripts/*.sh deployment/*.sh
          chmod +x scripts/*.sh deployment/*.sh
          zip -r deployguard-nexus.zip \
            appspec.yml \
            app/ \
            backend/ \
            risk-engine/ \
            dashboard/ \
            scripts/ \
            deployment/ \
            -x "*__pycache__*" "*.pyc" "*.pytest_cache*" "dashboard/deployments.json"
          unzip -l deployguard-nexus.zip | tail -n 5

      # 16. Upload CodeDeploy artifact
      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployguard-nexus-package
          path: deployguard-nexus.zip
          retention-days: 5

      # 17. Upload dashboard artifact
      - name: Upload Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployguard-nexus-dashboard
          path: dashboard/
          retention-days: 5

  # ---------------------------------------------------------------
  # CD: runs only after CI passes and the deployment gate approves,
  # and only for pushes to main (never for pull requests).
  # ---------------------------------------------------------------
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      AWS_REGION: ap-southeast-2
      S3_BUCKET: deployguard-nexus-068889454650
      CD_APPLICATION: DeployGuardNexus
      CD_GROUP: DeployGuard-Production

    steps:
      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: deployguard-nexus-package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload package to Amazon S3
        run: |
          aws s3 cp deployguard-nexus.zip \
            "s3://${S3_BUCKET}/releases/${GITHUB_SHA}.zip"

      - name: Start AWS CodeDeploy deployment
        id: deploy
        run: |
          ID=$(aws deploy create-deployment \
            --application-name "$CD_APPLICATION" \
            --deployment-group-name "$CD_GROUP" \
            --s3-location bucket=${S3_BUCKET},key=releases/${GITHUB_SHA}.zip,bundleType=zip \
            --description "GitHub Actions run ${GITHUB_RUN_ID} commit ${GITHUB_SHA}" \
            --query deploymentId --output text)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "CodeDeploy deployment: $ID"

      - name: Wait for deployment to succeed
        run: |
          aws deploy wait deployment-successful \
            --deployment-id "${{ steps.deploy.outputs.id }}"
          aws deploy get-deployment \
            --deployment-id "${{ steps.deploy.outputs.id }}" \
            --query 'deploymentInfo.[status,completeTime]' --output text
