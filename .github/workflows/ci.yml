name: DeployGuard Nexus CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:
  ci:

    runs-on: ubuntu-latest

    steps:

      # 1. Get the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # 2. Install Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # 3. Install project dependencies and security scanner
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install bandit


      # 4. Run all tests and generate test/coverage reports
      - name: Run Tests and Generate Reports
        run: |
          python -m pytest \
            -v \
            --cov=app \
            --cov-report=json:coverage.json \
            --junitxml=test-results.xml


      # 5. Run Bandit security scan
      # --exit-zero allows the Risk Engine to inspect findings
      # instead of Bandit immediately stopping the pipeline.
      - name: Run Security Scan
        run: |
          python -m bandit \
            -r app \
            -f json \
            -o bandit-report.json \
            --exit-zero


      # 6. Calculate deployment risk using real CI metrics
      - name: Run Deployment Risk Analysis
        run: |
          python risk-engine/ci_metrics.py


      # 7. Enforce the deployment decision
      - name: Run Deployment Gate
        run: |
          python risk-engine/deployment_gate.py


      # 8. Generate dashboard data
      - name: Generate Dashboard Data
        env:
          DEPLOYMENT_ID: "${{ github.run_id }}"
          GITHUB_SHA: "${{ github.sha }}"
        run: |
          python risk-engine/generate_dashboard_data.py


      # 9. Display the risk result in GitHub Actions
      - name: Display Risk Result
        run: |
          cat risk-result.json


      # 10. Create AWS CodeDeploy package
      - name: Create Deployment Package
        run: |
          zip -r deployguard-nexus.zip \
            appspec.yml \
            app/ \
            deployment/


      # 11. Upload CodeDeploy package
      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployguard-nexus-package
          path: deployguard-nexus.zip
          retention-days: 5


      # 12. Upload dashboard
      - name: Upload Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployguard-nexus-dashboard
          path: dashboard/
          retention-days: 5